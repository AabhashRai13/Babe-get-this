# Builds a release Android App Bundle (.aab) and uploads it as a
# downloadable artifact on the GitHub Actions run.
#
# No distribution / Play Store publish yet — that comes later once the
# Play Console + upload keystore exist. For now this just proves the app
# bundles cleanly in CI and parks the .aab somewhere you can grab it.
#
# The .aab is UNSIGNED (the `release` build type has no signingConfig).
# That's fine for archiving; Play App Signing handles signing at publish time.

name: Build AAB

on:
  # Runs automatically when prod-ready code lands on main, or on a version tag.
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  # Lets you trigger it manually from the Actions tab on any branch.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AGP 8.13 requires JDK 17 to run Gradle, even though the app itself
      # compiles to Java 11 bytecode (see compileOptions in app/build.gradle.kts).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle distribution + dependencies between runs,
      # so the second build is much faster than the first.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Linux runners may not preserve the executable bit on the wrapper script.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Quality gate: tests, then coverage. If either fails, no .aab is produced.
      #
      # prodDebug, NOT prodRelease. The Compose tests run on the JVM under
      # Robolectric, and createComposeRule() launches a ComponentActivity that is
      # declared by the ui-test-manifest artifact. That artifact works by merging
      # into the app manifest, so it is applied as debugImplementation — putting it
      # on release would merge test scaffolding into the shipped APK. On a release
      # variant every Compose test therefore fails with "Unable to resolve
      # activity for Intent ... androidx.activity.ComponentActivity".
      #
      # Still the prod FLAVOUR, so this keeps checking that the suite compiles and
      # passes against the prod source set (which has no FakeAuthRepository).
      - name: Run unit tests
        run: ./gradlew testProdDebugUnitTest

      # Coverage gate. Fails the build if the logic layer drops below the
      # threshold in app/build.gradle.kts, so a regression cannot produce a
      # release artifact. Runs on devDebug because that is the variant the Kover
      # report is configured for.
      - name: Verify coverage
        run: ./gradlew koverVerifyDevDebug

      # Build the production-flavor release bundle.
      # Output: app/build/outputs/bundle/prodRelease/app-prod-release.aab
      - name: Build prod release AAB
        run: ./gradlew bundleProdRelease

      # Upload the .aab so you can download it from the run's "Artifacts" section.
      # Artifacts are kept for 30 days, then auto-deleted.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-release-aab
          path: app/build/outputs/bundle/prodRelease/*.aab
          retention-days: 30
          if-no-files-found: error
