# Applies to every Robolectric test, so individual tests don't repeat @Config.
#
# application: use a plain Application, NOT the manifest's BabeGetThisApp.
# That class is @HiltAndroidApp, so Robolectric booting it builds the entire
# Hilt graph — including SupabaseModule, which constructs a real Supabase client
# and blows up on the JVM ("Failed to create default settings for
# SettingsSessionManager") before a single assertion runs. Unit tests build the
# handful of objects they need directly; they have no use for the DI graph.
# End-to-end tests DO want the real app, and they run under Hilt on a device
# instead, where that wiring works.
#
# sdk: Robolectric 4.13 has no image for compileSdk 36; 34 is the newest it
# ships and is well above minSdk 24.
application=android.app.Application
sdk=34
